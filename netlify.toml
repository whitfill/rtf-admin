# Netlify Configuration for RTF Admin Dashboard

[build]
  publish = "public"
  functions = "netlify/functions"

# Redirect all requests through the auth function for password protection
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
