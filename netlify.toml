# Netlify Configuration for RTF Admin Dashboard

[build]
  publish = "public"
  functions = "netlify/functions"

# Serve favicon files directly (before auth redirect)
[[redirects]]
  from = "/favicon-16x16.png"
  to = "/favicon-16x16.png"
  status = 200

[[redirects]]
  from = "/favicon-32x32.png"
  to = "/favicon-32x32.png"
  status = 200

# Redirect all other requests through the auth function for password protection
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
